# animation types
# 0 - don't animate
# 1 - animate continuously
# 2 - animate on trigger - else show first pic
# 3 - animate once at level start 

# object types
# 0  - passive
# 1  - turn left
# 2  - turn right
# 3  - one-way left
# 4  - one-way right
# 5  - water
# 6  - trap
# 7  - fire
# 8  - exit
# 9  - steel
# 10 - one-way up
# 11 - one-way down
# 32 - entrance

